type: Group
instructions:

  - type: ChangeDirectory
    directory: "{{.AgentWorkingDir}}/qt/qtbridge-swift"
    maxTimeInSeconds: 300
    maxTimeBetweenOutput: 120
    userMessageOnFailure: >
      Failed to change to qtbridge-swift dir

  - type: ExecuteCommand
    command: "swift build"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to build qtbridge for swift.

  - type: ExecuteCommand
    command: "swift test"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to run test.
